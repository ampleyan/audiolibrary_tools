username = ampleyan
password = Xus70aiaf71

# === OUTPUT ===
# Note: Use double backslashes for Windows paths in .conf files
path = "D:\\MUSIC\\TO PROCESS"
name-format = "{artist} - {title}"

# === QUALITY PREFERENCES (STRICT) ===
# We prioritize FLAC. If we settle for MP3, it MUST be 320kbps.
pref-format = flac,mp3
pref-min-bitrate = 320
pref-min-samplerate = 44100

# Strict Title/Artist matching prevents "remix" or "live" versions 
# from being downloaded when you wanted the studio version.
strict-title = true
strict-artist = true

# Length tolerance: 3s is safer than 5s to ensure it's the right edit/version
pref-length-tol = 3

# === SEARCH BEHAVIOR ===
# For MAX quality, set fast-search to FALSE. 
# This makes sldl wait to see ALL results so it can pick the 
# one with the best bitrate/format instead of just the "first" one.
fast-search = false

# Higher timeout gives slow Soulseek users time to respond with their high-quality files
# Default is 30s — raise to 2 minutes so slow peers can finish a typical 10MB file
max-stale-time = 120000
concurrent-downloads = 3

# === TRACKING & INDEXING ===
# This prevents downloading the same song twice if you run the script again
index-path = "D:\\MUSIC\\TO PROCESS\\sldl-index.sldl"
write-playlist = true

# === LOGGING ===
log-file = "D:\\MUSIC\\TO PROCESS\\sldl.log"