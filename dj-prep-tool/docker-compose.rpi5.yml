services:
  dj-prep:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_MODE: local
      BEETS_URL: ${BEETS_URL:-http://host.docker.internal:8337}
    volumes:
      - ./data:/data
      - ./music-library:/music/library
      - /mnt/media/MUSIC/FROMTOOL:/music/inbox
      - /mnt/media/MUSIC/RECENT:/music/archive
      - ./rekordbox:/rekordbox:ro
      - /home/ampleyan/projects/rpi-postgresql/infrastructure/postgres/run:/var/run/postgresql
